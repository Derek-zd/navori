# Navori Kubernetes 部署模板（MySQL 模式，rootful podman + privileged）
# 使用方法：
#   1. 替换下方所有 <...> 占位值（镜像地址、密钥、MySQL DSN、域名等）
#   2. kubectl create namespace navori
#   3. kubectl apply -f navori.yaml
#
# ── 重要：为什么需要 privileged ────────────────────────────
# 镜像内置 rootful podman 作为镜像构建器（与 aiops 同款方案），构建时
# 需要挂载 overlay 存储，因此 Pod 必须 privileged: true。若你的集群禁止
# privileged，本方案不可用（rootless/vfs 路线在托管集群不可靠，见 DESIGN
# §4.1 与 Git 历史）。
#
# 生成密钥：
#   openssl rand -hex 32   # -> MASTER_KEY
#   openssl rand -hex 32   # -> JWT_SECRET
#
# MySQL 建库（utf8mb4）：CREATE DATABASE navori ...; CREATE USER ...; GRANT ...
# DSN 格式：navori:<pwd>@tcp(<host>:3306)/navori?charset=utf8mb4&parseTime=True&loc=Local
#
# ── 数据分层 ─────────────────────────────────────────────
#   业务状态（仓库/流水线/run/凭据密文）  -> MySQL
#   密钥（MASTER_KEY/JWT_SECRET）        -> 下方 Secret 注入（重启不失效）
#   仓库克隆缓存 + run 日志              -> /data（PVC 可选，见文件尾）
#   podman 镜像/构建缓存                 -> /var/lib/containers（PVC 可选）
#
# ── 可选 PVC ─────────────────────────────────────────────
# 下方主清单不含 PVC（缓存随 Pod 重建清空，会自动重新 clone / pull）。
# 想持久化构建缓存与日志：取消文件尾 PVC 注释，并给 Deployment 加对应
# volumeMounts / volumes（/data 与 /var/lib/containers）。

---
apiVersion: v1
kind: Secret
metadata:
  name: navori-env
  namespace: navori
type: Opaque
stringData:
  DB_DRIVER: "mysql"
  DB_DSN: "navori:<mysql-password>@tcp(<mysql-host>:3306)/navori?charset=utf8mb4&parseTime=True&loc=Local"
  MASTER_KEY: "<master-key>"
  JWT_SECRET: "<jwt-secret>"
  JWT_EXPIRES_IN: "168h"
  ADMIN_USER: "admin"
  ADMIN_PASSWORD: "<admin-password>"      # 留空则首启打印到 Pod 日志
  BASE_URL: "https://<your-domain>"
  RUN_RETENTION: "10"
  HEALTH_CHECK_INTERVAL: "5"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navori
  namespace: navori
  labels: { app: navori }
spec:
  replicas: 1
  selector:
    matchLabels: { app: navori }
  template:
    metadata:
      labels: { app: navori }
    spec:
      containers:
        - name: navori
          image: <your-registry>/navori:latest
          ports: [{ containerPort: 3000 }]
          envFrom:
            - secretRef: { name: navori-env }
          # rootful podman 构建需要特权（挂载 overlay 存储）
          securityContext:
            privileged: true
          readinessProbe:
            httpGet: { path: /api/system/health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/system/health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "2",    memory: "2Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: navori
  namespace: navori
spec:
  selector: { app: navori }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: navori
  namespace: navori
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: <your-domain>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: navori
                port: { number: 3000 }
---
# ── 可选 PVC（构建缓存 + 日志持久化）───────────────────
# 取消注释并 apply；同时给 Deployment 主容器加：
#   volumeMounts:
